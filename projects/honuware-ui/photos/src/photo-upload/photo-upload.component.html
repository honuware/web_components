<div class="photo-upload-container">
  @if (loading) {
    <div class="loading-container">
      <mat-spinner diameter="30"></mat-spinner>
    </div>
  } @else {
    <!-- Current photo display -->
    @if (hasPhoto) {
      <div class="photo-display">
        <img [src]="photoUrl" class="current-photo" alt="Current photo">
      </div>
    } @else if (hasPendingFile) {
      <div class="photo-display">
        <img [src]="pendingPreviewUrl" class="current-photo" alt="Selected photo">
      </div>
    } @else {
      <div class="photo-placeholder">
        <mat-icon>image</mat-icon>
        <span>No photo</span>
      </div>
    }

    <!-- Upload area -->
    @if (!uploading) {
      <div class="upload-area"
           (dragover)="onDragOver($event)"
           (drop)="onDrop($event)">
        <mat-icon>cloud_upload</mat-icon>
        <span>Drag & drop or</span>
        <label class="file-input-label">
          <span>choose file</span>
          <!-- `image/*` already admits image/svg+xml; `.svg` is named as well
               because a file dragged from some file managers arrives with an
               empty MIME type, and extension matching is what catches it. -->
          <input type="file" accept="image/*,.svg" (change)="onFileSelected($event)" hidden>
        </label>
      </div>

      @if (hasPhoto) {
        <button mat-stroked-button color="warn" class="delete-button" (click)="onDeletePhoto()">
          <mat-icon>delete</mat-icon>
          Delete Photo
        </button>
      }
      @if (hasPendingFile) {
        <button mat-stroked-button color="warn" class="delete-button" (click)="clearPendingFile()">
          <mat-icon>close</mat-icon>
          Remove
        </button>
      }
    } @else {
      <div class="uploading-container">
        <mat-spinner diameter="24"></mat-spinner>
        <span>Processing...</span>
      </div>
    }

    @if (error) {
      <div class="error-message">{{ error }}</div>
    }
  }
</div>
