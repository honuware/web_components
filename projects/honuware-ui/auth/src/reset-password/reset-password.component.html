<div class="auth-card">
  <h1 class="auth-title">Choose a new password</h1>

  @if (!linkFailed) {
    <form [formGroup]="form" (ngSubmit)="onSetPassword()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>New Password</mat-label>
        <input id="password" matInput [type]="hidePassword ? 'password' : 'text'"
               formControlName="password" autocomplete="new-password" />
        <button type="button" matSuffix (click)="togglePasswordVisibility()"
                class="password-toggle" aria-label="Show or hide the password">
          <mat-icon>{{ hidePassword ? "visibility_off" : "visibility" }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirm New Password</mat-label>
        <input id="password2" matInput [type]="hidePassword ? 'password' : 'text'"
               formControlName="password2" autocomplete="new-password" />
        <button type="button" matSuffix (click)="togglePasswordVisibility()"
                class="password-toggle" aria-label="Show or hide the password">
          <mat-icon>{{ hidePassword ? "visibility_off" : "visibility" }}</mat-icon>
        </button>
      </mat-form-field>
      @if (showPasswordMismatch()) {
        <p class="auth-error" data-test="mismatch">Passwords do not match.</p>
      }

      <button id="SetPassword" mat-raised-button color="primary" type="submit" [disabled]="saving">
        Set Password
      </button>
    </form>
  } @else {
    <div class="auth-body">
      <p data-test="link-failed">This reset link is invalid or has expired.</p>
    </div>
    <button id="SendNewLink" mat-raised-button color="primary" type="button" (click)="sendNewLink()">
      Send a new link
    </button>
  }
</div>
