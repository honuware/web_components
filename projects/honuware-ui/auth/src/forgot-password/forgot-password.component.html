<div class="auth-card">
  <h1 class="auth-title">Reset your password</h1>

  @if (!sent) {
    <form [formGroup]="form" (ngSubmit)="onSend()" class="auth-form">
      <p class="auth-intro">
        Enter the email address you sign in with and we'll send you a link to choose a new password.
      </p>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input id="email" matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <button id="SendResetLink" mat-raised-button color="primary" type="submit" [disabled]="sending">
        Send reset link
      </button>
    </form>
  } @else {
    <div class="auth-body">
      <p data-test="sent-message">
        If an account exists for that email, we've sent a link to reset your password.
        Check your spam folder too.
      </p>
    </div>
  }

  <button id="BackToLogin" mat-stroked-button type="button" (click)="backToLogin()">
    Back to log in
  </button>
</div>
