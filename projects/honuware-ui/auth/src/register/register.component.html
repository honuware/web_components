<div class="auth-card">
  <h1 class="auth-title">Create Account</h1>

  <form [formGroup]="form" (ngSubmit)="onRegister()" class="auth-form">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input id="email" matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>First name</mat-label>
      <input id="first_name" matInput type="text" formControlName="first_name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Last name</mat-label>
      <input id="last_name" matInput type="text" formControlName="last_name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input id="password" matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
      <button type="button"
        matSuffix
        (click)="togglePasswordVisibility()"
        class="password-toggle">
        <mat-icon>
          {{
          hidePassword ? "visibility_off" : "visibility"
          }}
        </mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Reenter password</mat-label>
      <input id="password2" matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password2" />
      <button type="button"
        matSuffix
        (click)="togglePasswordVisibility()"
        class="password-toggle">
        <mat-icon>
          {{
          hidePassword ? "visibility_off" : "visibility"
          }}
        </mat-icon>
      </button>
      @if (showPasswordMismatch()) {
        <mat-error>
          Passwords do not match.
        </mat-error>
      }
    </mat-form-field>

    <button id="Register" mat-raised-button color="primary" type="submit">
      Register
    </button>
  </form>
</div>
