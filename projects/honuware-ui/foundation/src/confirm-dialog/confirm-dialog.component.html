<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  {{data.description}}
</mat-dialog-content>
<mat-dialog-actions>
  <button type="button" mat-raised-button color="primary" (click)="clickConfirm()">
    {{data.buttonText ?? 'Confirm'}}
  </button>
  <button type="button" mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
